<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Innovation Hackathon Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Top Hierarchy: The Startup Network, US Embassy, Embark -->
        <div class="top-sponsors">
            <img src="logos/transparent_top_sponsors.png" alt="Top Sponsors" class="responsive-strip">
        </div>

        <!-- Header -->
        <header class="header">
            <h1>STARTUP INNOVATION HACKATHON</h1>
            <p class="subtitle">AGENTIC AI IN NEPAL'S DIGITAL AGE TRANSFORMATION</p>
        </header>

        <!-- Main Timer (Circular Dashed - B&W Minimalist) -->
        <main class="timer-container">
            <div class="timer-wrapper">
                <svg viewBox="0 0 100 100" class="timer-svg">
                    <defs>
                        <mask id="progress-mask">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="10" 
                                    stroke-dasharray="283" stroke-dashoffset="0" id="mask-circle" 
                                    transform="rotate(-90 50 50)"/>
                        </mask>
                    </defs>
                    <!-- Background dashed track -->
                    <circle cx="50" cy="50" r="45" fill="none" class="timer-bg-circle" />
                    <!-- Foreground bright white dashed track -->
                    <circle cx="50" cy="50" r="45" fill="none" class="timer-fg-circle" mask="url(#progress-mask)" />
                </svg>
                <div id="timer" class="timer-text">24:00:00</div>
            </div>
        </main>

        <!-- Bottom Sponsors -->
        <footer class="sponsors-section">
            <img src="logos/transparent_bottom_sponsors.png" alt="Bottom Sponsors" class="responsive-strip">
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
